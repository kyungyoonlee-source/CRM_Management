<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyline CRM v9 — 기관 통합 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ DESIGN SYSTEM — Light Mode ═══ */
:root{
  --bg:#F4F6FA;--sf:#FFFFFF;--sf2:#F8F9FC;--sf3:#EEF1F7;
  --bd:#E2E8F0;--bd2:#CBD5E1;
  --tx:#1E293B;--tx2:#475569;--tx3:#94A3B8;
  --ac:#3B6FE8;--ac2:#6D4AFF;
  --g:#16A34A;--gb:rgba(22,163,74,.1);
  --am:#D97706;--amb:rgba(217,119,6,.1);
  --rd:#DC2626;--rdb:rgba(220,38,38,.1);
  --bl:#2563EB;--blb:rgba(37,99,235,.1);
  --pp:#7C3AED;--ppb:rgba(124,58,237,.1);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,.13);
  --sw:240px;--th:54px;--r:8px;--rl:12px;--rxl:16px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--sf3)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px}

/* SIDEBAR */
.sidebar{width:var(--sw);background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;box-shadow:var(--shadow)}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--bd)}
.sb-logo{font-size:14px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:9px;color:var(--tx)}
.sb-logo-ico{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-sub{font-size:10px;color:var(--tx3);margin-top:2px;padding-left:39px}
.sb-sec{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);padding:14px 16px 4px}
.sb-nav{padding:2px 8px}
.ni{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r);font-size:13px;color:var(--tx2);transition:all .15s;text-align:left;position:relative;font-weight:500}
.ni:hover{background:var(--sf3);color:var(--tx)}
.ni.active{background:var(--blb);color:var(--bl)}
.ni.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--bl);border-radius:0 3px 3px 0}
.ni svg{width:15px;height:15px;flex-shrink:0;opacity:.6}
.ni.active svg{opacity:1}
.ni-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:var(--rdb);color:var(--rd);font-weight:700}
.sb-footer{margin-top:auto;padding:13px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:8px}
.sb-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}

/* TOPBAR */
.topbar{height:var(--th);background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 22px;gap:9px;flex-shrink:0;box-shadow:var(--shadow)}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--tx)}
.sp{flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;transition:all .15s;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(59,111,232,.25)}
.btn-p:hover{background:#2d5fd4;transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,111,232,.35)}
.btn-g{background:var(--sf);color:var(--tx2);border:1px solid var(--bd2);box-shadow:var(--shadow)}
.btn-g:hover{background:var(--sf3);color:var(--tx)}
.btn-d{background:var(--rdb);color:var(--rd);border:1px solid rgba(220,38,38,.2)}
.btn-info{background:var(--blb);color:var(--bl);border:1px solid rgba(37,99,235,.2)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}

/* PAGES */
.page{display:none}
.page.active{display:flex;flex-direction:column;flex:1;overflow:hidden;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* STAT CARDS */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:18px 20px;position:relative;overflow:hidden;transition:all .2s;cursor:default;box-shadow:var(--shadow)}
.sc.clickable{cursor:pointer}
.sc.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--bd2)}
.sc-lb{font-size:11px;color:var(--tx3);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sc-v{font-size:28px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.sc-v.c-ac{color:var(--ac)}.sc-v.c-g{color:var(--g)}.sc-v.c-am{color:var(--am)}.sc-v.c-rd{color:var(--rd)}.sc-v.c-pp{color:var(--pp)}
.sc-s{font-size:11px;color:var(--tx3);margin-top:6px;display:flex;align-items:center;gap:4px}
.trend{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.t-up{background:var(--gb);color:var(--g)}.t-dn{background:var(--rdb);color:var(--rd)}
.sc-icon{position:absolute;right:16px;top:16px;font-size:22px;opacity:.15}

/* PANELS */
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.ph{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;background:var(--sf)}
.pt{font-size:13px;font-weight:600;color:var(--tx)}
.pb{padding:18px}
.pb-sm{padding:12px 16px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
thead th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--bd);background:var(--sf2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle;color:var(--tx)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--sf2)}
.tl{color:var(--bl);cursor:pointer;font-weight:500}
.tl:hover{text-decoration:underline}

/* FILTER BAR */
.fb{padding:10px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--sf2)}
.fi,.fs{padding:7px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:12px;background:var(--sf);color:var(--tx);transition:border .15s}
.fi{flex:1;min-width:140px}.fi::placeholder{color:var(--tx3)}
.fi:focus,.fs:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,111,232,.1)}
.fs option{background:var(--sf)}

/* BADGES & PILLS */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:var(--gb);color:var(--g)}.ba{background:var(--amb);color:var(--am)}.br{background:var(--rdb);color:var(--rd)}.bb{background:var(--blb);color:var(--bl)}.bp{background:var(--ppb);color:var(--pp)}.bn{background:var(--sf3);color:var(--tx2)}
.gp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;transition:transform .1s;border:1.5px solid}
.gp:hover{transform:scale(1.1)}
.gA{background:var(--gb);color:var(--g);border-color:rgba(22,163,74,.3)}.gB{background:var(--blb);color:var(--bl);border-color:rgba(37,99,235,.3)}.gC{background:var(--amb);color:var(--am);border-color:rgba(217,119,6,.3)}.gD{background:var(--rdb);color:var(--rd);border-color:rgba(220,38,38,.3)}.gN{background:var(--sf3);color:var(--tx3);border-color:var(--bd2)}

/* BAR CHART */
.bcr{margin:8px 0}
.bcr-l{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:4px}
.bcr-t{background:var(--sf3);border-radius:3px;height:7px;overflow:hidden}
.bcr-f{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}

/* MONTH BAR */
.mc{display:flex;align-items:flex-end;gap:4px;height:72px}
.mcc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.mcb{width:100%;border-radius:3px 3px 0 0;min-width:8px;transition:height .5s ease;cursor:pointer}
.mcb:hover{opacity:.75}
.mcl{font-size:9px;color:var(--tx3);white-space:nowrap}

/* TIMELINE */
.tl-item{display:flex;gap:12px;margin-bottom:18px}
.tl-g{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--sf);box-shadow:0 0 0 2px var(--ac);flex-shrink:0;margin-top:4px}
.tl-dot-c{background:var(--pp)}
.tl-line{width:1px;flex:1;background:var(--bd);margin-top:4px}
.tl-b{flex:1;padding-bottom:4px}
.tl-m{font-size:11px;color:var(--tx3);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.tl-tx{font-size:13px;color:var(--tx2);line-height:1.6}

/* INFO GRID */
.ig{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.ic{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:11px}
.ic.full{grid-column:span 2}
.ik{font-size:10px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.iv{font-size:13px;color:var(--tx);font-weight:500}

/* SIDE PANEL MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:all}
.modal{width:min(780px,96vw);height:100vh;background:var(--sf);border-left:1px solid var(--bd2);display:flex;flex-direction:column;transform:translateX(30px);transition:transform .25s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-lg)}
.ov.open .modal{transform:translateX(0)}
.mhdr{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:10px;flex-shrink:0;background:var(--sf2)}
.minfo{flex:1}
.mname{font-size:16px;font-weight:700;letter-spacing:-.4px}
.msub{font-size:12px;color:var(--tx3);margin-top:2px}
.mcl{width:28px;height:28px;border-radius:var(--r);background:var(--sf3);border:1px solid var(--bd);color:var(--tx2);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.mcl:hover{background:var(--bd2);color:var(--tx)}
.mtabs{display:flex;background:var(--sf2);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.mt{padding:10px 14px;font-size:12px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;cursor:pointer;background:none}
.mt:hover{color:var(--tx)}
.mt.active{color:var(--bl);border-bottom-color:var(--bl)}
.mbody{flex:1;overflow-y:auto;padding:18px 20px}
.tp{display:none}
.tp.active{display:block;animation:fi .2s ease}

/* CENTER MODALS */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sov.open{opacity:1;pointer-events:all}
.sm{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rxl);width:min(620px,96vw);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.97) translateY(10px);transition:transform .25s}
.sov.open .sm{transform:scale(1) translateY(0)}
.smh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sf);z-index:1}
.smt{font-size:15px;font-weight:700}
.smb{padding:18px 20px}
.smf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;background:var(--sf2)}
.sm-wide{width:min(900px,96vw)}

/* FORMS */
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px}
.fin,.fse{padding:8px 11px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:13px;width:100%}
.fta{padding:8px 11px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:13px;resize:vertical;min-height:85px;line-height:1.6;width:100%}
.fin:focus,.fse:focus,.fta:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,111,232,.1)}

/* INTERVIEW FORM SPECIFICS */
.iv-section{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--bd)}
.iv-section:last-child{border-bottom:none}
.iv-section-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;font-weight:800;flex-shrink:0;margin-right:8px}
.iv-section-title{font-size:14px;font-weight:700;color:var(--tx);display:flex;align-items:center;margin-bottom:14px}
.iv-q{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px;display:flex;align-items:flex-start;gap:6px}
.iv-opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.iv-cb-wrap{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--bd2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx2);background:var(--sf)}
.iv-cb-wrap input{accent-color:var(--ac);width:13px;height:13px;cursor:pointer}
.iv-cb-wrap.checked{background:var(--blb);border-color:var(--bl);color:var(--bl);font-weight:600}
.iv-radio-wrap{display:flex;gap:10px;margin-bottom:10px}
.iv-radio-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:var(--sf)}
.iv-radio-btn.temp-good{border-color:var(--g);color:var(--g);background:var(--gb)}
.iv-radio-btn.temp-mid{border-color:var(--am);color:var(--am);background:var(--amb)}
.iv-radio-btn.temp-bad{border-color:var(--rd);color:var(--rd);background:var(--rdb)}
.temp-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.temp-good-dot{background:var(--g)}.temp-mid-dot{background:var(--am)}.temp-bad-dot{background:var(--rd)}

/* TOAST & EMPTY */
#toasts{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:7px}
.toast{padding:11px 16px;border-radius:var(--rl);font-size:13px;font-weight:500;max-width:320px;transform:translateY(12px) scale(.96);opacity:0;transition:all .3s ease;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-md);background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46}
.toast.show{transform:none;opacity:1}
.empty{text-align:center;padding:32px 16px;color:var(--tx3);font-size:13px}

/* SCORE BUTTONS */
.score-row{padding:12px 0;border-bottom:1px solid var(--bd)}
.score-row:last-child{border-bottom:none}
.score-row-title{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:3px}
.score-row-desc{font-size:11px;color:var(--tx3);margin-bottom:9px}
.score-btns{display:flex;gap:6px;align-items:center}
.sbtn{width:36px;height:36px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;border:1.5px solid var(--bd2);background:var(--sf);color:var(--tx3);display:inline-flex;align-items:center;justify-content:center}
.sbtn:hover{border-color:var(--ac);color:var(--ac)}
.sbtn.s1.active{background:#DC2626;border-color:#DC2626;color:#fff}
.sbtn.s2.active{background:#D97706;border-color:#D97706;color:#fff}
.sbtn.s3.active{background:#2563EB;border-color:#2563EB;color:#fff}
.sbtn.s4.active,.sbtn.s5.active{background:#16A34A;border-color:#16A34A;color:#fff}
.score-display{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rl);padding:16px;margin-top:14px;display:flex;align-items:center;justify-content:space-between}
.score-num{font-size:36px;font-weight:900;line-height:1}
.score-grade{font-size:13px;font-weight:700;margin-top:4px}

/* MULTI-SELECT CHECKBOX GROUP */
.ms-group{display:flex;flex-wrap:wrap;gap:6px}
.ms-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;color:var(--tx2);transition:all .15s;user-select:none;background:var(--sf)}
.ms-chip:hover{border-color:var(--ac);color:var(--tx)}
.ms-chip input{accent-color:var(--ac);width:13px;height:13px;cursor:pointer;margin:0}
.ms-chip.checked{background:var(--blb);border-color:var(--bl);color:var(--bl);font-weight:600}

/* MISC */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-hcell{text-align:center;font-size:10px;font-weight:700;color:var(--tx3);padding:4px 0}
.cal-cell{min-height:70px;border:1px solid var(--bd);border-radius:6px;padding:5px 6px;background:var(--sf);position:relative;overflow:hidden}
.cal-cell.other-month{background:var(--sf2);opacity:.5}
.cal-cell.today{border-color:var(--ac);background:var(--blb)}
.cal-day{font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:3px}
.cal-event{font-size:10px;padding:1px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.st-tbl{width:100%;border-collapse:collapse;font-size:12px}
.st-tbl th{padding:9px 11px;background:var(--sf2);color:var(--tx2);font-weight:700;border:1px solid var(--bd2);text-align:center;font-size:11px}
.st-tbl td{padding:9px 11px;border:1px solid var(--bd);color:var(--tx2);vertical-align:top;line-height:1.6;font-size:12px}

@media print{
  .sidebar,.topbar,#toasts,.btn,.pgr,.fb{display:none!important}
  #app{display:block!important}
  .main{display:block!important}
  .page.active{display:block!important;overflow:visible!important}
  .content{overflow:visible!important;padding:0!important}
}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s">
  <div style="font-size:40px;margin-bottom:16px">📚</div>
  <div style="font-size:22px;font-weight:800;color:#1E293B">Storyline CRM v9</div>
</div>

<div id="app">

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sb-brand">
    <div class="sb-logo"><div class="sb-logo-ico">📚</div>Storyline CRM</div>
    <div class="sb-sub">기관 통합 관리 시스템 v9</div>
  </div>
  <div class="sb-sec">Overview</div>

<script>
const KEY = 'slcrm_v9_multi';
let DB = { seq:1000, insts:[], interviews:[], vocs:[], edus:[], visits:[] };

function loadDB(){
  try{
    let d = JSON.parse(localStorage.getItem(KEY));
    if(!d || !d.insts || d.insts.length===0) { d = seed(); }
    if(!d.interviews || d.interviews.length===0) { d.interviews = seedInterviews(d.insts||[]); }
    DB = d;
    save();
  }catch(e){ DB = seed(); DB.interviews = seedInterviews(DB.insts); save(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function uid(){ return 'x'+(DB.seq++)+'_'+Date.now(); }
function today(){ return new Date().toISOString().slice(0,10); }

/* SEED DATA */
function seed(){
  const s = { seq:1000, insts:[], vocs:[], edus:[], visits:[], interviews:[] };
  const names=['햇살어린이집','별빛유치원','예쁜나라유치원','초록숲어린이집','하늘빛유치원','사랑가득어린이집','무지개어린이집','푸른하늘유치원','아이사랑어린이집','행복어린이집'];
  const grades=['A','B','B','C','D','A','B','C','A','B'];
  const hubs=['Y','N','N','N','N','Y','Y','N','N','Y'];
  const agesPool=['만 1세, 만 2세','만 3세, 4세, 5세','만 1~5세 전체','만 4세, 5세','만 2세, 3세'];
  const daysPool=['월, 수, 금','주 5일 (월~금)','화, 목','주 3일 (자율)','월, 화, 수, 목, 금'];
  const rnd=(arr)=>arr[Math.floor(Math.random()*arr.length)];

  for(let i=0; i<50; i++){
    const gr = i<10 ? grades[i] : rnd(['A','B','C','D']);
    s.insts.push({
      id: 'i'+i,
      name: (i<10?names[i]:`테스트기관${i}`),
      res: rnd(['김민지','김지은','이경윤','안지훈']),
      branch: rnd(['서울지사','경기지사','부산지사']),
      region: rnd(['서울','경기','인천','부산']),
      addr: '상세 주소 예시',
      dir: '원장님'+i,
      tel: '010-1234-567'+(i%10),
      yr: (i%4)+1,
      hub: (i<10?hubs[i]:rnd(['Y','N'])),
      grade: gr,
      ages: rnd(agesPool),
      days: rnd(daysPool)
    });
  }
  return s;
}

const IV_YEARS_POOL = ['1년차','2년차','3년차','4년차','5년차+'];
const IV_INTERVIEWER_POOL = ['김민지','김지은','이경윤','안지훈'];

const IV_Q = {
  q2_goal: {label:'스토리라인 도입 목적(초기 기대)은 무엇이었나요?', opts:['영유아 이해','부모 상담','교사 업무 경감','운영 마케팅','교사 전문성 향상'], hasEtc:true},
  q2_satisfy:{label:'가장 만족하는 부분은 무엇인가요?', opts:['영유아 이해','부모 상담','교사 업무 경감','운영 마케팅','교사 전문성 향상','아직 없음'], hasEtc:true},
  q2_regret: {label:'가장 아쉬운 부분은 무엇인가요?', opts:['비쥬얼 데이터 관련','쌍둥이 송출','리포트 정확성','리포트 활용성','어플 및 웹사이트 기능','인사이트'], hasEtc:true},
  q2_data_use:{label:'데이터/리포트를 상담 외에 활용하고 있는 부분이 있나요?', opts:['관찰일지','포트폴리오','부모 발송용 자료','프로젝트 수업'], hasEtc:true, hasNone:true},
  q2_parent_app:{label:'부모용 어플을 활용하고 있나요?', opts:['적극적으로 사용 중','선택적 활용 중','사용 안함'], single:true},
  q3_edu_programs:{label:'참여하신 교육 프로그램은 무엇인가요?', opts:['시스템 등록 교육','시스템 이해 교육','90일 즐기기 교육(1)','90일 즐기기 교육(2)','4월 리포트 교육','9월 리포트 교육','1월 리포트 교육'], hasEtc:true},
  q3_consult_need:{label:'추가로 필요한 컨설팅이 있다면 적어주세요.', type:'text'},
  q3_refer:{label:'타 기관 추천 의향 및 추천 기관이 있나요?', opts:['있음','없음'], single:true},
  q3_feature_need:{label:'장기 활용을 위해 꼭 추가되었으면 하는 기능은?', type:'text'},
  q3_parent_sat:{label:'학부모 만족도 체감 정도는?', opts:['매우 만족','만족','보통','불만족','매우 불만족'], single:true},
  q4_alarm_intent:{label:'알림장 앱 출시 시, 사용 의향이 있나요?', opts:['있음','없음','잘 모르겠음'], single:true},
  q4_alarm_feature:{label:'알림장 앱 대체 시 꼭 필요한 기능은?', type:'text'},
  q5_effect:{label:'교육·컨설팅 이후 도움이 된 부분이 있나요?', type:'text'},
  q5_need_more:{label:'추가로 도움받고 싶은 부분이 있다면?', type:'text'},
  q6_researcher_opinion:{label:'연구원 의견(교사 및 원장 특징)', type:'text'},
  q6_temperature:{label:'기관 온도 체크', opts:['좋음','보통','위험'], single:true, isTemp:true},
  q6_support_points:{label:'향후 지원 및 개선 필요 포인트', type:'text'},
  q6_extra:{label:'추가 의견 및 특이사항', type:'text'},
};

const IV_SECTIONS = [
  {num:2, title:'데이터/리포트 만족 및 활용', keys:['q2_goal','q2_satisfy','q2_regret','q2_data_use','q2_parent_app']},
  {num:3, title:'실태 파악', keys:['q3_edu_programs','q3_consult_need','q3_refer','q3_feature_need','q3_parent_sat']},
  {num:4, title:'스토리라인 2.0', keys:['q4_alarm_intent','q4_alarm_feature']},
  {num:5, title:'교육 및 컨설팅 효과', keys:['q5_effect','q5_need_more']},
  {num:6, title:'연구원 종합 의견', keys:['q6_researcher_opinion','q6_temperature','q6_support_points','q6_extra']},
];

function seedInterviews(insts){
  const ivs=[];
  for(let i=0; i<Math.min(25, insts.length); i++){
    ivs.push({
      id: 'iv_'+i, iid: insts[i].id, date: '2025-06-0'+(i%9+1),
      iv_years: insts[i].yr+'년차', interviewer: '김민지',
      q6_temperature: ['좋음','보통','위험'][i%3],
      q2_goal: ['영유아 이해','부모 상담'],
      q2_satisfy: ['교사 전문성 향상'],
      q4_alarm_intent: ['있음','없음','잘 모르겠음'][i%3],
      q2_regret: ['인사이트'],
      q6_researcher_opinion: '테스트용 자동 생성 인터뷰 데이터입니다.'
    });
  }
  return ivs;
}

window.onload=()=>{ loadDB(); nav('dashboard', document.querySelectorAll('.ni')[0]); };

let CUR='';

/* UI Logic */
function nav(page, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(page==='dashboard') renderDash();
  if(page==='inst') renderInst();
  if(page==='interview-results') renderInterviewResults();
}

function openSov(id) { document.getElementById(id).classList.add('open'); }
function closeSov(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast show'; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2000);
}

function renderDash(){
  document.getElementById('dash-date').textContent=today();
  document.getElementById('dash-stats').innerHTML=`
    <div class="sc"><div class="sc-lb">전체 기관 수</div><div class="sc-v c-ac">${DB.insts.length}</div></div>
    <div class="sc"><div class="sc-lb">누적 인터뷰</div><div class="sc-v c-g">${DB.interviews.length}</div></div>
  `;
}

function renderInst(){
  const tbody = document.getElementById('inst-tbody');
  tbody.innerHTML = DB.insts.slice(0, 15).map(i=>`
    <tr>
      <td><span class="tl" onclick="openModal('${i.id}')" style="font-weight:600">${i.name}</span></td>
      <td><span class="badge ${i.grade==='A'?'bg':i.grade==='D'?'br':'ba'}">${i.grade||'N'}</span></td>
      <td>${i.region}</td><td>${i.res}</td>
      <td>${i.hub==='Y'?'Y':'N'}</td><td>${i.yr}년차</td>
      <td>${i.ages||'—'}</td><td>${i.days||'—'}</td>
      <td><button class="btn btn-xs btn-p" onclick="openModal('${i.id}')">상세</button></td>
    </tr>
  `).join('');
}

function openModal(id){
  CUR = id;
  const i = DB.insts.find(x=>x.id===id); if(!i) return;
  document.getElementById('m-name').textContent = i.name;
  
  document.getElementById('m-basic-grid').innerHTML=`
    <div class="ic"><div class="ik">원장명</div><div class="iv">${i.dir}</div></div>
    <div class="ic"><div class="ik">원장 전화</div><div class="iv">${i.tel}</div></div>
    <div class="ic"><div class="ik">관할 지사</div><div class="iv">${i.branch}</div></div>
    <div class="ic"><div class="ik">연차</div><div class="iv">${i.yr}년차</div></div>
    <div class="ic"><div class="ik">관리 등급</div><div class="iv">${i.grade||'미분류'}</div></div>
    <div class="ic"><div class="ik">거점원 여부</div><div class="iv">${i.hub==='Y'?'Y (거점원)':'N (비거점원)'}</div></div>
    <div class="ic"><div class="ik">사용 연령(반)</div><div class="iv">${i.ages||'미입력'}</div></div>
    <div class="ic"><div class="ik">제공일</div><div class="iv">${i.days||'미입력'}</div></div>
    <div class="ic full"><div class="ik">주소</div><div class="iv">${i.addr}</div></div>`;
  
  renderMInterview();
  switchMT(document.querySelectorAll('.mt')[0], 'mt-basic');
  document.getElementById('inst-modal').classList.add('open');
}
function closeInstModal(){ document.getElementById('inst-modal').classList.remove('open'); }
function switchMT(btn, id){
  document.querySelectorAll('.mt').forEach(t=>t.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('.tp').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active');
}

function openAddInst(){
  document.getElementById('sov-inst-title').textContent='기관 추가';
  document.getElementById('ei-id').value='';
  ['ei-name','ei-res','ei-addr','ei-dir','ei-tel','ei-yr','ei-hub','ei-branch','ei-region','ei-ages','ei-days'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  openSov('sov-inst');
}
function openEditInst(){
  const i = DB.insts.find(x=>x.id===CUR); if(!i) return;
  document.getElementById('sov-inst-title').textContent='기관 정보 수정';
  document.getElementById('ei-id').value=i.id;
  document.getElementById('ei-name').value=i.name;
  document.getElementById('ei-res').value=i.res;
  document.getElementById('ei-branch').value=i.branch;
  document.getElementById('ei-region').value=i.region;
  document.getElementById('ei-addr').value=i.addr;
  document.getElementById('ei-dir').value=i.dir;
  document.getElementById('ei-tel').value=i.tel;
  document.getElementById('ei-yr').value=i.yr;
  document.getElementById('ei-hub').value=i.hub;
  document.getElementById('ei-ages').value=i.ages||'';
  document.getElementById('ei-days').value=i.days||'';
  openSov('sov-inst');
}

function saveInst(){
  const editId=document.getElementById('ei-id').value;
  const data = {
    name: document.getElementById('ei-name').value.trim(),
    res: document.getElementById('ei-res').value.trim(),
    branch: document.getElementById('ei-branch').value,
    region: document.getElementById('ei-region').value,
    addr: document.getElementById('ei-addr').value.trim(),
    dir: document.getElementById('ei-dir').value.trim(),
    tel: document.getElementById('ei-tel').value.trim(),
    yr: document.getElementById('ei-yr').value,
    hub: document.getElementById('ei-hub').value,
    ages: document.getElementById('ei-ages').value.trim(),
    days: document.getElementById('ei-days').value.trim()
  };
  
  if(!data.name){ toast('기관명을 입력하세요'); return; }
  
  if(editId){
    const idx = DB.insts.findIndex(x=>x.id===editId);
    if(idx>=0){ data.id=editId; data.grade=DB.insts[idx].grade; DB.insts[idx]=data; }
  } else {
    data.id = uid(); data.grade=''; DB.insts.push(data);
  }
  save(); closeSov('sov-inst'); renderInst(); if(editId) openModal(editId);
  toast('저장 완료', 'success');
}

function renderMInterview(){
  const inst = DB.insts.find(x=>x.id===CUR); if(!inst) return;
  const el = document.getElementById('m-interview-content'); if(!el) return;
  const histories = DB.interviews.filter(iv=>iv.iid===CUR).sort((a,b)=>b.date.localeCompare(a.date));
  const latest = histories[0] || null;

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:13px;font-weight:700">현장 인터뷰 입력</div>
      <button class="btn btn-p btn-sm" onclick="saveInterview()">💾 인터뷰 결과 저장</button>
    </div>
    ${IV_SECTIONS.map(sec=>`
    <div class="iv-section">
      <div class="iv-section-title"><span class="iv-section-num">${sec.num}</span>${sec.title}</div>
      ${sec.keys.map(key=>renderIvQuestion(key, latest)).join('')}
    </div>`).join('')}
  `;
}

function renderIvQuestion(key, latest){
  const q = IV_Q[key]; if(!q) return '';
  const val = latest ? (latest[key]||[]) : [];
  if(q.type==='text'){
    return `<div style="margin-bottom:12px"><div class="iv-q">${q.label}</div><textarea class="fta" id="iv_${key}" style="min-height:40px">${latest?latest[key]||'':''}</textarea></div>`;
  }
  if(q.isTemp){
    const cur = latest?latest[key]||'':'';
    return `<div style="margin-bottom:12px"><div class="iv-q">${q.label}</div><div class="iv-radio-wrap">
      <label class="iv-radio-btn"><input type="radio" name="iv_temperature" value="좋음" ${cur==='좋음'?'checked':''}> 좋음</label>
      <label class="iv-radio-btn"><input type="radio" name="iv_temperature" value="보통" ${cur==='보통'?'checked':''}> 보통</label>
      <label class="iv-radio-btn"><input type="radio" name="iv_temperature" value="위험" ${cur==='위험'?'checked':''}> 위험</label>
    </div></div>`;
  }
  const valArr = Array.isArray(val)?val:[val].filter(Boolean);
  return `<div style="margin-bottom:12px">
    <div class="iv-q">${q.label}</div>
    <div class="iv-opts">
      ${q.opts.map(opt=>`<label class="iv-cb-wrap${valArr.includes(opt)?' checked':''}"><input type="${q.single?'radio':'checkbox'}" name="iv_${key}" value="${opt}" ${valArr.includes(opt)?'checked':''} onchange="this.parentElement.classList.toggle('checked', this.checked)"> ${opt}</label>`).join('')}
    </div>
  </div>`;
}

function saveInterview(){
  const iv = { id: uid(), iid: CUR, date: today() };
  Object.keys(IV_Q).forEach(key=>{
    const q=IV_Q[key];
    if(q.type==='text'){ iv[key] = document.getElementById('iv_'+key)?.value.trim()||''; }
    else if(q.isTemp){ const sel=document.querySelector('input[name="iv_temperature"]:checked'); iv[key]=sel?sel.value:''; }
    else if(q.single){ const sel=document.querySelector(`input[name="iv_${key}"]:checked`); iv[key]=sel?sel.value:''; }
    else { iv[key] = [...document.querySelectorAll(`input[name="iv_${key}"]:checked`)].map(e=>e.value); }
  });
  DB.interviews.push(iv); save(); toast('인터뷰 저장 완료', 'success'); renderMInterview();
}

function renderInterviewResults(){
  const ivs = DB.interviews || [];
  document.getElementById('iv-results-summary').innerHTML = `전체 응답 수: ${ivs.length}건`;
  // (Simplified for brevity)
}

function backupData(){
  const json=JSON.stringify(DB,null,2);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=`storyline_crm_backup_${today()}.json`; a.click();
}
function restoreData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    DB=JSON.parse(e.target.result); save(); location.reload();
  }; reader.readAsText(file,'utf-8');
}
</script>
